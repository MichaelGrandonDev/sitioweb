<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FluxusTerapia · Masoterapia y bienestar {% endblock %}</title>
  <meta name="description" content="FluxusTerapia — masoterapia, rehabilitación kinésica, medicina china y movimiento consciente. Michael Grandon, masajista profesional en Coronel Suárez. Seguinos en Instagram @fluxusterapia.">
  <link rel="canonical" href="https://fluxusterapia.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fluxusterapia.com/">
  <meta property="og:title" content="FluxusTerapia">
  <meta property="og:description" content="Masoterapia y terapias para el bienestar integral. Coronel Suárez · @fluxusterapia">
  <meta property="og:image" content="https://fluxusterapia.com/img/hero.jpg">
  <meta property="og:see_also" content="https://www.instagram.com/fluxusterapia/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}#inicio">
      <img
        class="brand-logo"
        src="{{ url_for('static', filename='img/logo-circle.png') }}"
        alt="FluxusTerapia"
        width="68"
        height="68"
      >
    </a>
    <nav class="site-nav" aria-label="Principal">
      <a href="{{ url_for('index') }}#inicio">Inicio</a>
      <a href="{{ url_for('index') }}#servicios">Servicios</a>
      <a href="{{ url_for('index') }}#contacto">Contacto</a>
      <a href="/blogs/">Blogs</a>
      <a class="nav-academia" href="/academia/">AcademiaFluxus</a>
    </nav>
    <div class="social" aria-label="Redes">
      <a
        class="social-ig"
        href="https://www.instagram.com/fluxusterapia/"
        target="_blank"
        rel="noopener noreferrer me"
        aria-label="Instagram @fluxusterapia"
        title="Instagram"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">

            <radialGradient id="igGrad_base" cx="30%" cy="107%" r="150%">
              <stop offset="0%" stop-color="#fdf497"/>
              <stop offset="5%" stop-color="#fdf497"/>
              <stop offset="45%" stop-color="#fd5949"/>
              <stop offset="60%" stop-color="#d6249f"/>
              <stop offset="90%" stop-color="#285AEB"/>

        </svg>
      </a>
      <a
        class="social-yt"
        href="https://www.youtube.com/@fluxusterapia"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube FluxusTerapia"
        title="YouTube"
      >
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/>
          <path fill="#fff" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>© {{ year }} FluxusTerapia · Michael Grandon</p>
    <p>
      <a
        href="https://www.instagram.com/fluxusterapia/"
        target="_blank"
        rel="noopener noreferrer"
      >@fluxusterapia</a>
      ·
      <a href="https://fluxusterapia.com">fluxusterapia.com</a>
    </p>
  </footer>

  <a
    class="whatsapp-float"
    href="https://wa.me/5492932537949?text=Hola%20FluxusTerapia%2C%20quiero%20consultar%20por%20un%20turno"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Escribinos por WhatsApp"
  >
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" fill="currentColor">

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
